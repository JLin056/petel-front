<div class="header">
    <div class="logo" (click)="onClickHome()">
        <a href="#"><img src="https://petelcathay-user.s3.us-east-1.amazonaws.com/Petel_footage/petel_logo_004.png" alt="Petel Logo" class="logo-img"></a>
    </div>

    <div class="navbar">
        <ul class="navbar-items">
            <li (click)="onClickHome()">首頁</li>
            <li (click)="onClickDog()">狗狗旅館</li>
            <li (click)="onClickCat()">貓貓旅館</li>
            <li (click)="onClickContact()">聯絡我們</li>
        </ul>
    </div>

    <div class="account">
        <i
            class="pi pi-comments"
            style="color: #2e2424; font-size: 1.5rem;"
            (click)="onClickChat()"
        ></i>
        <div style="position: relative; display: inline-block;">
            <i
                class="pi pi-bell"
                style="color: #2e2424; font-size: 1.5rem; cursor: pointer;"
                (click)="onClickNotification()"
            ></i>
            <span
                *ngIf="unreadCount > 0"
                class="notification-badge"
            >
                {{ unreadCount > 99 ? '99+' : unreadCount }}
            </span>
        </div>
        <i
            class="pi pi-user"
            style="color: #2e2424; font-size: 1.5rem;"
            (click)="onClickProfile()"
        ></i>
        <div class="auth-area">
            <!-- 判斷登入 -->
            <button *ngIf="!isLoggedIn" pButton class="LoginLogout" label="登入" (click)="onClickLogin()" [outlined]="true"></button>
            <!-- 判斷登出 -->
            <button *ngIf="isLoggedIn" pButton class="LoginLogout" label="登出" (click)="confirmVisible = true" [outlined]="true" [disabled]="isLoggedOut"></button>
        </div>
    </div>
</div>

<!-- 登出 dialog -->
<app-shared-confirm-dialog
    [(visible)]="confirmVisible"
    header="登出確認"
    message="確定要登出嗎？"
    confirmLabel="登出"
    cancelLabel="取消"
    (confirm)="onLogout()"
></app-shared-confirm-dialog>

<!-- 通知面板 -->
<app-notification-panel
    [(visible)]="notificationPanelVisible"
></app-notification-panel>
