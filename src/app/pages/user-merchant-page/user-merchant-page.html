<div class="wrap">
    <!-- 商家會員資訊區 -->
    <div class="user-info-container">
        <div class="image">
            <img class="avatar" [src]="user.avatarUrl || 'img/avatar.png'" alt="頭貼">
        </div>
        <div class="user-info">
            <div class="title">
                <i class="pi pi-info-circle"></i>
                <h3>商家資訊</h3>
            </div>
            <div class="content">
                <div class="item">
                    <p class="material-symbols-outlined">person</p>
                    <div class="item-text">
                        <p>{{ user.name }}</p>
                    </div>
                </div>
                <div class="item">
                    <p class="material-symbols-outlined">mail</p>
                    <div class="item-text">
                        <p>{{ user.email }}</p>
                    </div>
                </div>
                <div class="item">
                    <p class="material-symbols-outlined">call</p>
                    <div class="item-text">
                        <p>{{ user.phone }}</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 按鈕區：置中 -->
    <div class="button-container">
        <p-button label="修改會員資訊" styleClass="button" (click)="openEdit()" [outlined]="true"></p-button>
    </div>

    <!-- 分隔線 -->
    <div class="divider"></div>

    <!-- 我的旅館 -->
    <div class="hotel-list-section">
        <h3 class="section-title">我的旅館</h3>
        <div class="hotel-list">
            <div class="hotel-card" (click)="onPropertyClick()">
                <img src="img/hotelImg.png" alt="旅館照片" class="hotel-img" />
                <div class="hotel-info">
                    <h4>汪汪小站</h4>
                    <p class="hotel-address">台北市大安區和平東路200號</p>
                </div>
            </div>

            <div class="hotel-card" (click)="onPropertyClick()">
                <img src="img/hotelImg.png" alt="旅館照片" class="hotel-img" />
                <div class="hotel-info">
                    <h4>毛孩樂園寵物旅館</h4>
                    <p class="hotel-address">台北市中正區幸福路100號</p>
                </div>
            </div>
        </div>
    </div>

    <p-toast></p-toast>
</div>
