<div class="auth-page">
    <div class="hero">
        <h1>歡迎回來</h1>
        <p>為毛孩找到像家的旅館 🐾</p>
    </div>

    <div class="auth-card">
        <h2 class="card-title">會員登入</h2>

        <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
            <!-- 錯誤訊息 -->
            <!-- <div *ngIf="errorMessage" class="error-message">
                <i class="pi pi-exclamation-triangle"></i>
                {{ errorMessage }}
            </div> -->

            <div class="input-container">
                <label for="email">信箱</label>
                <input pInputText id="email" formControlName="email" placeholder="請輸入信箱" />
            </div>
            <div *ngIf="emailControl?.invalid && emailControl?.touched" class="error-text">
                {{ getErrorMessage('email') }}
            </div>

            <div class="input-container-password">
                <label for="password">密碼</label>
                <p-password
                formControlName="password"
                [feedback]="false"
                inputStyleClass="petel-input"
                placeholder="請輸入密碼">
                </p-password>
            </div>
            <div *ngIf="passwordControl?.invalid && passwordControl?.touched" class="error-text">
                {{ getErrorMessage('password') }}
            </div>

            <!-- <div class="aux-row">
                <a class="auth-link" routerLink="/forgot">忘記密碼？</a>
            </div> -->

            <div class="button-container">
                <button pButton type="button" class="p-button-secondary ghost">取消</button>
                <button
                    pButton
                    type="submit"
                    [disabled]="isLoading || loginForm.invalid || loginForm.pending"
                    [loading]="isLoading"
                    label="登入"
                ></button>
            </div>
        </form>

        <div class="auth-footer">
            <span>還沒有帳號？</span>
            <a class="auth-link" (click)="goRegister()">立即註冊</a>
        </div>
    </div>
</div>

<app-add-user-info-dialog
    [(visible)]="showFillDialog"
    (save)="onDialogSave($event)"
    (cancel)="showFillDialog = false">
</app-add-user-info-dialog>
