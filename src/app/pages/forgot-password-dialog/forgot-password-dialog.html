<p-dialog
    header="忘記密碼"
    [modal]="true"
    [(visible)]="visible"
    (onHide)="onHideDialog()"
    [style]="{width: '400px'}"
    styleClass = "petel-auth-dialog"
>
    <div class="container">
        <div class="input-container">
            <label for="email">信箱</label>
            <input pInputText id="email" class="email-input" [(ngModel)]="email" />
        </div>
    </div>
    <div class="button-container">
        <p-button label="取消" severity="secondary" (click)="onHideDialog()"></p-button>
        <p-button label="送出" (click)="onSend()" [loading]="loading"/>
    </div>
</p-dialog>
