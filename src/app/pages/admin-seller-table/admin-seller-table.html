<h3 class="title">賣家列表</h3>

<div class="card">
  <p-table
    #dt
    [value]="sellerList"
    dataKey="SELLER_ID"
    [rows]="5"
    [rowsPerPageOptions]="[5, 10, 15, 20]"
    [loading]="loading"
    [paginator]="true"
    [globalFilterFields]="['SELLER_ID', 'ACCOUNT_ID', 'EMAIL', 'NAME', 'BUSINESS_CODE', 'STATUS']"
    [tableStyle]="{ 'min-width': '60rem' }"
  >
    <ng-template pTemplate="caption">
      <div class="flex items-center">
        <p-iconfield iconPosition="left" class="ml-auto">
          <p-inputicon>
            <i class="pi pi-search"></i>
          </p-inputicon>
          <input
            pInputText
            type="text"
            [ngModel]="searchValue"
            (ngModelChange)="dt.filterGlobal($any($event), 'contains')"
            placeholder="搜尋賣家"
          />
        </p-iconfield>
      </div>
    </ng-template>
    <ng-template pTemplate="header">
      <tr>
        <th style="width:16%">帳號ID</th>
        <th style="width:20%">電子郵件</th>
        <th style="width:20%">賣家名稱</th>
        <th style="width:24%">特定寵物業許可證號</th>
        <th style="width:10%">狀態</th>
        <th style="width:10%">操作</th>
      </tr>
      <tr>
        <th>
          <input
            pInputText
            type="text"
            [ngModel]="accountIdFilter"
            (ngModelChange)="dt.filter($any($event), 'ACCOUNT_ID', 'contains')"
            placeholder="搜尋帳號ID"
            class="w-full"
          />
        </th>
        <th>
          <input
            pInputText
            type="text"
            [ngModel]="emailFilter"
            (ngModelChange)="dt.filter($any($event), 'EMAIL', 'contains')"
            placeholder="搜尋電子郵件"
            class="w-full"
          />
        </th>
        <th>
          <input
            pInputText
            type="text"
            [ngModel]="nameFilter"
            (ngModelChange)="dt.filter($any($event), 'NAME', 'contains')"
            placeholder="搜尋賣家名稱"
            class="w-full"
          />
        </th>
        <th>
          <input
            pInputText
            type="text"
            [ngModel]="businessCodeFilter"
            (ngModelChange)="dt.filter($any($event), 'BUSINESS_CODE', 'contains')"
            placeholder="搜尋統一編號"
            class="w-full"
          />
        </th>
        <th></th>
        <th></th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-seller>
      <tr>
        <td><span class="text-large">{{ seller.ACCOUNT_ID }}</span></td>
        <td>
          <div class="flex items-center gap-2">
            <i class="pi pi-envelope icon-large"></i>
            <span class="text-large">{{ seller.EMAIL }}</span>
          </div>
        </td>
        <td>
          <div class="flex items-center gap-2">
            <i class="pi pi-building icon-large"></i>
            <span class="text-large">{{ seller.NAME }}</span>
          </div>
        </td>
        <td><span class="text-large">{{ seller.BUSINESS_CODE }}</span></td>
        <td>
          <p-tag [value]="getStatusLabel(seller.STATUS)" [severity]="getStatusSeverity(seller.STATUS) || undefined" class="tag-large" />
        </td>
        <td>
          <div class="flex gap-2">
            <p-button
              class="deleteBtn"
              icon="pi pi-trash"
              [rounded]="true"
              [outlined]="true"
              severity="danger"
              (onClick)="confirmDelete(seller)"
            />
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="7">查無賣家資料</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<!-- 刪除確認對話框 -->
<app-shared-confirm-dialog
  [(visible)]="deleteConfirmVisible"
  header="刪除賣家"
  [message]="'確定要刪除賣家 ' + (selectedSeller?.NAME || '') + ' 嗎？此操作無法復原。'"
  confirmLabel="刪除"
  cancelLabel="取消"
  (confirm)="onDeleteConfirmed()"
  (cancel)="onDeleteCancelled()"
></app-shared-confirm-dialog>
