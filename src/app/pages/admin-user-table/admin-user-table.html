<h3 class="title">會員列表</h3>

<div class="card">
  <p-table
    #dt
    [value]="memberList"
    dataKey="ACCOUNT_ID"
    [rows]="5"
    [rowsPerPageOptions]="[5, 10, 15, 20]"
    [loading]="loading"
    [paginator]="true"
    [globalFilterFields]="['ACCOUNT_ID', 'EMAIL', 'NAME', 'PHONE', 'STATUS']"
    [tableStyle]="{ 'min-width': '60rem' }"
  >
    <ng-template pTemplate="caption">
      <div class="flex items-center">
        <p-iconfield iconPosition="left" class="ml-auto">
          <p-inputicon>
            <i class="pi pi-search"></i>
          </p-inputicon>
          <input
            pInputText
            type="text"
            [ngModel]="searchValue"
            (ngModelChange)="dt.filterGlobal($any($event), 'contains')"
            placeholder="搜尋會員"
          />
        </p-iconfield>
      </div>
    </ng-template>
    <ng-template pTemplate="header">
      <tr>
        <th style="width:16%">帳號ID</th>
        <th style="width:16%">電子郵件</th>
        <th style="width:16%">姓名</th>
        <th style="width:16%">電話</th>
        <th style="width:16%">狀態</th>
        <th style="width:16%">操作</th>
      </tr>
      <tr>
        <th>
          <input
            pInputText
            type="text"
            [ngModel]="accountIdFilter"
            (ngModelChange)="dt.filter($any($event), 'ACCOUNT_ID', 'contains')"
            placeholder="搜尋帳號ID"
            class="w-full"
          />
        </th>
        <th>
          <input
            pInputText
            type="text"
            [ngModel]="emailFilter"
            (ngModelChange)="dt.filter($any($event), 'EMAIL', 'contains')"
            placeholder="搜尋電子郵件"
            class="w-full"
          />
        </th>
        <th>
          <input
            pInputText
            type="text"
            [ngModel]="nameFilter"
            (ngModelChange)="dt.filter($any($event), 'NAME', 'contains')"
            placeholder="搜尋姓名"
            class="w-full"
          />
        </th>
        <th>
          <input
            pInputText
            type="text"
            [ngModel]="phoneFilter"
            (ngModelChange)="dt.filter($any($event), 'PHONE', 'contains')"
            placeholder="搜尋電話"
            class="w-full"
          />
        </th>
        <th></th>
        <th></th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-member>
      <tr>
        <td><span class="text-large">{{ member.ACCOUNT_ID }}</span></td>
        <td>
          <div class="flex items-center gap-2">
            <i class="pi pi-envelope icon-large"></i>
            <span class="text-large">{{ member.EMAIL }}</span>
          </div>
        </td>
        <td>
          <div class="flex items-center gap-2">
            <i class="pi pi-user icon-large"></i>
            <span class="text-large">{{ member.NAME }}</span>
          </div>
        </td>
        <td>
          <div class="flex items-center gap-2">
            <i class="pi pi-phone icon-large"></i>
            <span class="text-large">{{ member.PHONE }}</span>
          </div>
        </td>
        <td>
          <p-tag [value]="getStatusLabel(member.STATUS)" [severity]="getStatusSeverity(member.STATUS) || undefined" class="tag-large" />
        </td>
        <td>
          <div class="flex gap-2">
            <p-button
              class="deleteBtn"
              icon="pi pi-trash"
              [rounded]="true"
              [outlined]="true"
              severity="danger"
              (onClick)="confirmDelete(member)"
            />
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="6">查無會員資料</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<!-- 刪除確認對話框 -->
<app-shared-confirm-dialog
  [(visible)]="deleteConfirmVisible"
  header="刪除會員"
  [message]="'確定要刪除會員 ' + (selectedMember?.NAME || '') + ' 嗎？此操作無法復原。'"
  confirmLabel="刪除"
  cancelLabel="取消"
  (confirm)="onDeleteConfirmed()"
  (cancel)="onDeleteCancelled()"
></app-shared-confirm-dialog>
