<p-dialog
    header="修改會員資訊"
    [modal]="true"
    [(visible)]="visible"
    (onHide)="onHideDialog()"
    [style]="{width: '600px'}"
    styleClass = "petel-auth-dialog"
>
    <div class="container">

    <!-- 頭貼區 -->
    <div class="avatar-box">
            <img
                [src]="previewSrc || 'img/avatar.png'"
                alt="avatar"
                class="avatar"
            />
            <small class="hint">喜歡其他張？</small>
        </div>

        <div class="avatar-grid" *ngIf="avatars.length; else emptyArea">
            <div
                class="avatar-item"
                *ngFor="let a of avatars; let i = index"
                [class.selected]="selectedIndex === i"
                (click)="selectAvatar(i)"
            >
                <img [src]="toDataUrl(a)" alt="avatar-option" />
            </div>
        </div>

        <ng-template #emptyArea>
            <div class="empty">
                <p *ngIf="!loadingAvatars">目前沒有可選頭貼，或尚未載入。</p>
            </div>
        </ng-template>


        <!-- 表單區 -->
        <div class="input-container">
            <label for="name">姓名</label>
            <input pInputText id="name" class="text-input"
                    [(ngModel)]="name" #nameCtrl="ngModel"
                    required maxlength="30" />
            <small class="error-text" *ngIf="nameCtrl.invalid && nameCtrl.touched">姓名為必填，長度 1–30。</small>
        </div>

        <div class="input-container">
            <label for="phone">電話</label>
            <input pInputText id="phone" name="phone" class="text-input"
                    [(ngModel)]="phone" #phoneCtrl="ngModel"
                    required pattern="^09[0-9]{8}$" inputmode="numeric" placeholder="例如：0912345678" />
            <small class="error-text" *ngIf="phoneCtrl.invalid && phoneCtrl.touched">
                請輸入有效手機（09 開頭，共 10 碼）。
            </small>
        </div>
    </div>

    <div class="button-container">
        <p-button label="取消" severity="secondary" (click)="onHideDialog()"></p-button>
        <p-button label="確認修改" (click)="onSave(nameCtrl, phoneCtrl)" [disabled]="loading" [loading]="loading" />
    </div>
</p-dialog>
