<p-dialog
  header="訂單詳細資料"
  [(visible)]="visible"
  (onHide)="onHideDialog()"
  [modal]="true"
  [style]="{width: '950px', 'max-width': '95vw'}"
  [dismissableMask]="true"
  [draggable]="false"
  [resizable]="false">

  <div class="order-detail-content" *ngIf="order">
    <!-- 會員姓名(可點擊) -->
    <div class="detail-row full-width">
      <label class="detail-label">會員姓名</label>
      <div class="detail-value clickable" (click)="navigateToMember()">
        <i class="pi pi-user"></i>
        <span>{{ order.USER_NAME }}</span>
        <i class="pi pi-external-link"></i>
      </div>
    </div>

    <!-- 訂購人姓名及電話 -->
    <div class="detail-row">
      <div class="detail-item">
        <label class="detail-label">訂購人姓名</label>
        <div class="detail-value">
          <i class="pi pi-user"></i>
          <span>{{ order.USER_NAME }}</span>
        </div>
      </div>
      <div class="detail-item">
        <label class="detail-label">訂購人電話</label>
        <div class="detail-value">
          <i class="pi pi-phone"></i>
          <span>{{ order.USER_PHONE }}</span>
        </div>
      </div>
    </div>

    <!-- 旅館名稱及房型 -->
    <div class="detail-row">
      <div class="detail-item">
        <label class="detail-label">旅館名稱</label>
        <div class="detail-value clickable" (click)="navigateToHotel()">
          <i class="pi pi-building"></i>
          <span>{{ order.PROPERTY_NAME }}</span>
          <i class="pi pi-external-link"></i>
        </div>
      </div>
      <div class="detail-item">
        <label class="detail-label">房型</label>
        <div class="detail-value">
          <i class="pi pi-home"></i>
          <span>{{ order.ROOM }}</span>
        </div>
      </div>
    </div>

    <!-- 入住日期及退房日期 -->
    <div class="detail-row">
      <div class="detail-item">
        <label class="detail-label">入住日期</label>
        <div class="detail-value">
          <i class="pi pi-calendar"></i>
          <span>{{ order.CHECK_IN }}</span>
        </div>
      </div>
      <div class="detail-item">
        <label class="detail-label">退房日期</label>
        <div class="detail-value">
          <i class="pi pi-calendar"></i>
          <span>{{ order.CHECK_OUT }}</span>
        </div>
      </div>
    </div>

    <!-- 總價格及狀態 -->
    <div class="detail-row">
      <div class="detail-item">
        <label class="detail-label">總價格</label>
        <div class="detail-value price">
          <i class="pi pi-dollar"></i>
          <span class="price-amount">{{ order.HOTEL_CHARGES }}</span>
        </div>
      </div>
      <div class="detail-item">
        <label class="detail-label">狀態</label>
        <div class="detail-value status" [ngClass]="'status-' + getStatusClass(order.STATUS)">
          <i class="pi pi-info-circle"></i>
          <span class="status-text">{{ order.STATUS }}</span>
        </div>
      </div>
    </div>

    <!-- 備註 -->
    <div class="detail-row full-width note-section">
      <label class="detail-label">備註</label>
      <div class="note-content">
        <div *ngIf="!isEditingNote" class="note-display">
          <div class="note-text">
            {{ order.NOTE || '無備註' }}
          </div>
          <p-button
            icon="pi pi-pencil"
            severity="secondary"
            [text]="true"
            size="small"
            (onClick)="onEditNote()"
            label="編輯" />
        </div>
        <div *ngIf="isEditingNote" class="note-edit">
          <textarea
            pInputText
            [(ngModel)]="editedNote"
            rows="4"
            class="note-textarea"
            placeholder="請輸入備註...">
          </textarea>
          <div class="note-actions">
            <p-button
              label="取消"
              severity="secondary"
              [outlined]="true"
              size="small"
              (onClick)="onCancelEdit()" />
            <p-button
              label="儲存"
              severity="primary"
              size="small"
              (onClick)="onSaveNote()" />
          </div>
        </div>
      </div>
    </div>
  </div>

  <ng-template #footer>
    <p-button
      label="關閉"
      (onClick)="onHideDialog()"
      severity="secondary" />
  </ng-template>
</p-dialog>
