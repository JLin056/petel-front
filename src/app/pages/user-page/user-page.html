<div class="wrap">
    <!-- 會員資訊區 -->
    <div class="user-info-container" *ngIf="user as u">
        <div class="image">
            <img class="avatar" [src]="u.mediaBase64" alt="頭貼">
        </div>
        <div class="user-info">
            <div class="title">
                <h3>會員資訊</h3>
            </div>

            <div class="content">
                <div class="item">
                    <p class="material-symbols-outlined">person</p>
                    <div class="item-text">
                        <p>{{ u.name || '—' }}</p>
                    </div>
                </div>
                <div class="item">
                    <p class="material-symbols-outlined">mail</p>
                    <div class="item-text">
                        <p>{{ u.email || '—' }}</p>
                    </div>
                </div>

                <div class="item">
                    <p class="material-symbols-outlined">call</p>
                    <div class="item-text">
                        <p>{{ u.phone || '—' }}</p>
                    </div>
                </div>
            </div>
            <div class="button-container">
                <p-button
                    label="修改會員資訊"
                    styleClass="button"
                    (click)="openEdit()"
                    [outlined]="true"
                />
            </div>
        </div>
    </div>
    <!-- 歷史訂單區 -->
    <div class="order">
        <h3>您的歷史訂單紀錄</h3>

        <p *ngIf="isLoadingBookings">載入中...</p>
        <p *ngIf="!isLoadingBookings && bookingsError" class="error">{{ bookingsError }}</p>
        <p *ngIf="!isLoadingBookings && !bookingsError && ((orders?.length ?? 0) === 0)" class="empty-text">目前還沒有訂購過！快訂購看看吧</p>

        <div *ngFor="let o of orders" class="order-item">
            <div class="order-item-img">
                <img [src]="'img/hotelImg.png'" alt="旅館照片">
            </div>

            <div class="order-item-content">
                <h4>{{ o.propertyName }}</h4>

                <div class="order-content">
                    <div>
                        <p>訂單編號：{{ o.orderId }}</p>
                        <p>入住時間：{{ o.checkIn }} ~ {{ o.checkOut }}</p>
                    </div>
                    <div>
                        <p>
                            訂單狀態：
                            <p-tag
                                [value]="o.status"
                                [severity]="getStatusSeverity(o.status)"
                                class="status-tag">
                            </p-tag>
                        </p>
                        <p>訂單金額：${{ price(o.totalPrice) }}</p>
                        <p>旅館評分：{{ o.propertyAvg }}</p>
                    </div>
                </div>

                <div class="button-container">
                    <p-button
                        label="取消訂單"
                        styleClass="button"
                        [outlined]="true"
                        (click)="confirmDeleteOrder($event, o.orderId)"
                        [disabled]="isCancelDisabled(o.status)">
                    </p-button>

                    <p-button
                        label="聊聊"
                        styleClass="button"
                        [outlined]="true">
                    </p-button>

                    <p-button
                        label="評論"
                        styleClass="button"
                        [outlined]="true"
                        [disabled]="!o.hasReview">
                    </p-button>
                </div>
            </div>
        </div>
    </div>

    <p-toast />

    <!-- 修改會員資訊 dialog -->
    <app-update-user-dialog
        [(visible)]="editVisible"
        [user]="user"
        (saved)="onEditSaved($event)">
    </app-update-user-dialog>

    <!-- 取消訂單 confirm dialog -->
    <app-shared-confirm-dialog
        [header]="'確認取消訂單'"
        [message]="'確定要取消此訂單嗎？'"
        [(visible)]="deleteOrderVisible"
        (confirm)="onDeleteOrderConfirmed()"
        (cancel)="deleteOrderVisible = false"
    ></app-shared-confirm-dialog>
</div>
