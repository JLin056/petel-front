<div class="wrap">
    <!-- 會員資訊區 -->
    <div class="user-info-container">
        <div class="image">
            <img class="avatar" [src]="user.avatarUrl || 'img/avatar.png'" alt="頭貼">
        </div>
        <div class="user-info">
            <div class="title">
                <!-- <i class="pi pi-info-circle"></i> -->
                <h3>會員資訊</h3>
            </div>
            <div class="content">
                <div class="item">
                    <p class="material-symbols-outlined">person</p>
                    <div class="item-text">
                        <p>{{ user.name }}</p>
                    </div>
                </div>
                <div class="item">
                    <p class="material-symbols-outlined">mail</p>
                    <div class="item-text">
                        <p>{{ user.email }}</p>
                    </div>
                </div>
                <div class="item">
                    <p class="material-symbols-outlined">call</p>
                    <div class="item-text">
                        <p>{{ user.phone }}</p>
                    </div>
                </div>
            </div>
            <div class="button-container">
                <p-button
                    label="修改會員資訊"
                    styleClass="button"
                    (click)="openEdit()"
                    [outlined]="true"
                />
                <p-button
                    label="刪除會員"
                    styleClass="button"
                    (click)="showConfirm()"
                    [outlined]="true"
                />
                <!-- <button type="button" class="button" (click)="openEdit()">修改會員資訊</button>
                <button type="button" class="button" (click)="confirmDelete()">刪除會員</button> -->
            </div>
        </div>
    </div>
    <!-- 歷史訂單區 -->
    <div class="order">
        <h3>您的歷史訂單紀錄</h3>

        <p *ngIf="isLoadingBookings">載入中...</p>
        <p *ngIf="!isLoadingBookings && bookingsError" class="error">{{ bookingsError }}</p>
        <p *ngIf="!isLoadingBookings && !bookingsError && ((orders?.length ?? 0) === 0)" class="empty-text">目前還沒有訂購過！快訂購看看吧</p>

        <div *ngFor="let o of orders" class="order-item">
            <div class="order-item-img">
                <img [src]=" 'img/hotelImg.png'" alt="旅館照片">
            </div>

            <div class="order-item-content">
                <h4>{{ o.propertyName }}</h4>

                <div class="order-content">
                    <div>
                        <p>訂單編號：{{ o.orderId }}</p>
                        <p>入住時間：{{ o.checkIn }} ~ {{ o.checkOut }}</p>
                    </div>
                    <div>
                        <p>訂單狀態：{{ o.status }}</p>
                        <p>訂單金額：${{ price(o.totalPrice) }}</p>
                        <p>旅館評分：{{ o.propertyAvg }}</p>
                    </div>
                </div>

                <div class="button-container">
                    <p-button
                        label="取消訂單"
                        styleClass="button"
                        [outlined]="true"
                        (click)="confirmDeleteOrder($event, o.orderId)"
                        [disabled]="o.status !== '預約成功' && o.status !== '待入住'">
                    </p-button>

                    <p-button
                        label="聊聊"
                        styleClass="button"
                        [outlined]="true">
                    </p-button>

                    <p-button
                        label="評論"
                        styleClass="button"
                        [outlined]="true"
                        [disabled]="!o.hasReview">
                    </p-button>
                </div>
            </div>
        </div>
    </div>

    <p-toast />

    <!-- 修改會員資訊 dialog -->
    <app-update-user-dialog
        [(visible)]="editVisible"
        [user]="user"
        (saved)="onEditSaved($event)">
    </app-update-user-dialog>

    <!-- 刪除會員 confirm dialog -->
    <app-shared-confirm-dialog
        [header]="'確認刪除會員'"
        [message]="'確定要刪除此會員嗎？此操作無法復原。'"
        [(visible)]="deleteUserVisible"
        (confirm)="onDeleteUserConfirmed()"
        (cancel)="deleteUserVisible = false"
    ></app-shared-confirm-dialog>

    <!-- 取消訂單 confirm dialog -->
    <app-shared-confirm-dialog
        [header]="'確認取消訂單'"
        [message]="'確定要取消此訂單嗎？'"
        [(visible)]="deleteOrderVisible"
        (confirm)="onDeleteOrderConfirmed()"
        (cancel)="deleteOrderVisible = false"
    ></app-shared-confirm-dialog>
</div>
