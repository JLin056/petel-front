<p-toast></p-toast>

<h3 class="title">旅館列表</h3>

<div class="search-container">
    <div class="search-fields">
        <div class="flex flex-col gap-2">
            <label for="propertyId">旅館ID</label>
            <input pInputText id="propertyId" class="custom-input" [(ngModel)]="propertyIdFilter" />
        </div>
        <div class="flex flex-col gap-2">
            <label for="propertyName">旅館名稱</label>
            <input pInputText id="propertyName" class="custom-input" [(ngModel)]="propertyNameFilter" />
        </div>
        <div class="search-btn-container">
            <p-button label="搜尋" styleClass="admin-search-btn" (onClick)="onSearch()"></p-button>
        </div>
    </div>
</div>

<div class="card">
  <p-table
    #dt
    [value]="hotelList"
    dataKey="PROPERTY_ID"
    [rows]="pageSize"
    [rowsPerPageOptions]="[1, 5, 10, 15, 20]"
    [paginator]="true"
    [lazy]="true"
    [totalRecords]="totalRecords"
    (onLazyLoad)="onPageChange($event)"
    [tableStyle]="{ 'min-width': '60rem' }"
  >
    <ng-template pTemplate="header">
      <tr>
        <th style="width:12%">旅館ID</th>
        <th style="width:20%">
          <i class="pi pi-building icon-large"></i>
          旅館名稱
        </th>
        <th style="width:14%">
          <i class="pi pi-phone icon-large"></i>
          電話
        </th>
        <th style="width:28%">
          <i class="pi pi-map-marker icon-large"></i>
          地址
        </th>
        <th style="width:14%">
          <i class="pi pi-user icon-large"></i>
          賣家名稱
        </th>
        <th style="width:12%">操作</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-hotel>
      <tr>
        <td><span class="text-large">{{ hotel.PROPERTY_ID }}</span></td>
        <td><span class="text-large">{{ hotel.PROPERTY_NAME }}</span></td>
        <td><span class="text-large">{{ hotel.TEL }}</span></td>
        <td><span class="text-large">{{ hotel.ADDRESS }}</span></td>
        <td>
          <span class="text-large seller-name-link" (click)="viewSellerDetails(hotel.SELLER_NAME)">
            {{ hotel.SELLER_NAME }}
          </span>
        </td>
        <td>
          <div class="flex gap-2">
            <p-button
              icon="pi pi-history"
              [rounded]="true"
              [outlined]="true"
              severity="info"
              (onClick)="viewHotelOrders(hotel)"
              pTooltip="查看歷史訂單"
              tooltipPosition="top"
            />
            <p-button
              class="deleteBtn"
              icon="pi pi-trash"
              [rounded]="true"
              [outlined]="true"
              severity="danger"
              (onClick)="confirmDelete(hotel)"
              pTooltip="刪除旅館"
              tooltipPosition="top"
            />
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="6">查無旅館資料</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<!-- 刪除確認對話框 -->
<app-shared-confirm-dialog
  [(visible)]="deleteConfirmVisible"
  header="刪除旅館"
  [message]="'確定要刪除旅館 ' + (selectedHotel?.PROPERTY_NAME || '') + ' 嗎？此操作無法復原。'"
  confirmLabel="刪除"
  cancelLabel="取消"
  (confirm)="onDeleteConfirmed()"
  (cancel)="onDeleteCancelled()"
></app-shared-confirm-dialog>
