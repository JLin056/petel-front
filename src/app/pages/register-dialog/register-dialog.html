<p-dialog
    header="會員註冊"
    [modal]="true"
    [(visible)]="visible"
    (onHide)="onHideDialog()"
    [style]="{width: '600px'}"
    styleClass = "petel-auth-dialog"
>
    <form [formGroup]="registerForm" (ngSubmit)="onRegister()">
        <div class="container">
            <!-- 錯誤訊息 -->
            <div *ngIf="errorMessage" class="error-message">
                <i class="pi pi-exclamation-triangle"></i>
                {{ errorMessage }}
            </div>

            <div class="input-container">
                <label for="email">信箱</label>
                <input
                    pInputText
                    id="email"
                    formControlName="email"
                    [disabled]="isLoading"
                    placeholder="請輸入信箱"
                    class="email-input"
                />
            </div>
            <div *ngIf="emailControl?.invalid && emailControl?.touched" class="error-text">
                {{ getErrorMessage('email') }}
            </div>

            <div class="input-container">
                <label for="password">密碼</label>
                <p-password
                    id="password"
                    formControlName="password"
                    [disabled]="isLoading"
                    [feedback]="false"
                    placeholder="請輸入密碼"
                />
            </div>
            <div *ngIf="passwordControl?.invalid && passwordControl?.touched" class="error-text">
                {{ getErrorMessage('password') }}
            </div>

            <div class="input-container">
                <label for="confirm">確認密碼</label>
                <p-password
                    id="confirm"
                    formControlName="confirm"
                    [disabled]="isLoading"
                    [feedback]="false"
                    placeholder="請再次輸入密碼"
                />
            </div>
            <div *ngIf="confirmControl?.touched && registerForm.hasError('passwordsMismatch')" class="error-text">
                {{ getErrorMessage('confirm') }}
            </div>
        </div>
        <div class="button-container">
            <p-button
                label="取消"
                severity="secondary"
                type="button"
                (click)="onHideDialog()"
                [disabled]="isLoading">
            </p-button>
            <p-button
                label="註冊"
                type="submit"
                [loading]="isLoading"
                [disabled]="isLoading"
            />
        </div>
    </form>

    <div class="auth-footer">
        <span class="p-text-secondary block mb-8">已有帳號？ </span>
        <a class="auth-link" (click)="onGoLogin()">立刻登入</a>
    </div>
</p-dialog>
