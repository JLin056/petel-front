<div class="hotel-container">
    <h2 class="page-title">新增旅館資訊</h2>
    <form [formGroup]="propertyForm" (ngSubmit)="onSubmit()">

        <!-- 旅館圖片區 -->
        <div class="info-section">
            <h3>旅館圖片</h3>
            <div class="image-placeholder">
                <input type="file" accept="image/*" multiple hidden #fileInput (change)="onImageSelect($event)">
                <button type="button" class="btn-upload" (click)="fileInput.click()">
                    <i class="pi pi-images"></i> 選擇圖片
                </button>

                <div *ngIf="uploadedImages.length > 0" class="image-preview-area">
                    <div class="image-grid" cdkDropList (cdkDropListDropped)="onImageDrop($event)">
                        <div *ngFor="let img of uploadedImages; let i = index" class="image-item" cdkDrag>
                            <img [src]="img.previewUrl" alt="預覽圖片">
                            <div class="image-overlay">
                                <span class="sort-number">{{ img.sortOrder }}</span>
                                <button type="button" class="btn-remove" (click)="removeUploadedImage(i)">
                                    <i class="pi pi-times"></i>
                                </button>
                            </div>
                            <div class="drag-placeholder" *cdkDragPlaceholder></div>
                        </div>
                    </div>
                    <p class="hint-text"><i class="pi pi-arrows-alt"></i> 拖拉圖片可調整順序</p>
                </div>
            </div>
        </div>

        <!-- 基本資訊 -->
        <div class="info-section">
            <h3>基本資訊</h3>
            <div class="form-grid">
                <label>旅館名稱</label>
                <input type="text" pInputText formControlName="name">

                <label>特許寵物業許可證號</label>
                <input type="text" pInputText formControlName="businessCode">

                <label>銀行帳號 <span class="required">*</span></label>
                <input type="text" pInputText formControlName="bankAccount">

                <label>電話 <span class="required">*</span></label>
                <input type="text" pInputText formControlName="tel">

                <label>地址 <span class="required">*</span></label>
                <div class="address-row">
                    <p-select class="city-input" [options]="avaliableCities" formControlName="city" placeholder="縣市名"
                        (onChange)="onCityChange($event.value)">
                    </p-select>
                    <p-select class="district-input" [options]="avaliableDistrict" formControlName="district"
                        placeholder="鄉鎮市區名">
                    </p-select>
                    <input class="addressDetail-input" type="text" pInputText formControlName="addressDetail"
                        placeholder="詳細地址">
                </div>

                <label>設施 <span class="required">*</span></label>
                <p-multiselect [options]="avaliableFacilities" formControlName="selectedFacilities"
                    optionLabel="facilityName" placeholder="選取旅館可用的設施" [maxSelectedLabels]="3" class="p-multiselect">
                </p-multiselect>
            </div>
        </div>

        <!-- 旅館說明 -->
        <div class="info-section">
            <h3>旅館介紹</h3>
            <textarea pInputTextarea rows="3" formControlName="info"></textarea>

            <h3>入住須知</h3>
            <textarea pInputTextarea rows="3" formControlName="checkNotice"></textarea>

            <h3>寵物須知</h3>
            <textarea pInputTextarea rows="3" formControlName="petNotice"></textarea>

            <h3>旅館規範</h3>
            <textarea pInputTextarea rows="3" formControlName="propertyNotice"></textarea>
        </div>

        <!-- 按鈕 -->
        <div class="form-actions">
            <button pButton label="儲存" icon="pi pi-check" class="btn-save" type="submit"></button>
            <button pButton label="取消" icon="pi pi-times" class="btn-clear" type="button"
                (click)="onCancelClick()"></button>
        </div>
    </form>
</div>

<!-- 取消確認對話框 -->
<app-shared-confirm-dialog [(visible)]="cancelConfirmVisible" header="取消確認" message="確定要取消新增嗎？已填寫的資料將不會被儲存。"
    confirmLabel="確定" cancelLabel="繼續編輯" (confirm)="onCancelConfirm()" (cancel)="onCancelCancel()">
</app-shared-confirm-dialog>
