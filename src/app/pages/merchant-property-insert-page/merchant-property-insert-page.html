<div class="hotel-container">

    <h2>新增旅館資訊</h2>

    <!-- 基本資訊 -->
    <div class="info-section">
        <h3>基本資訊</h3>
        <div class="form-grid">
            <label>旅館名稱</label>
            <input type="text" pInputText [(ngModel)]="hotel.name" placeholder="請輸入旅館名稱">

            <label>電話</label>
            <input type="text" pInputText [(ngModel)]="hotel.tel" placeholder="請輸入電話">

            <label>地址</label>
            <input type="text" pInputText [(ngModel)]="hotel.address" placeholder="請輸入地址">
        </div>
    </div>

    <!-- 旅館圖片 -->
    <div class="info-section">
        <h3>旅館圖片</h3>
        <input type="file" (change)="onFileSelect($event)" multiple>
        <div class="image-preview" *ngIf="hotel.propertyImages.length">
            <img *ngFor="let img of hotel.propertyImages" [src]="img.base64Data" alt="旅館圖片">
        </div>
    </div>
    <!-- <div class="upload-test">
<app-upload-img></app-upload-img>
    </div> -->

    <!-- 旅館說明 -->
    <div class="info-section">
        <h3>旅館介紹</h3>
        <textarea pInputTextarea rows="3" [(ngModel)]="hotel.info"></textarea>

        <h3>入住須知</h3>
        <textarea pInputTextarea rows="3" [(ngModel)]="hotel.checkNotice"></textarea>

        <h3>寵物須知</h3>
        <textarea pInputTextarea rows="3" [(ngModel)]="hotel.petNotice"></textarea>

        <h3>旅館規範</h3>
        <textarea pInputTextarea rows="3" [(ngModel)]="hotel.propertyNotice"></textarea>
    </div>

    <!-- 設施 -->
    <div class="info-section">
        <h3>設施</h3>
        <div class="facility-list">
            <div class="facility-item" *ngFor="let f of hotel.facilities; let i = index">
                <input type="text" pInputText [(ngModel)]="f.facilityName" placeholder="輸入設施名稱">
                <button pButton icon="pi pi-trash" severity="danger" (click)="removeFacility(i)"></button>
            </div>
            <button pButton label="新增設施" icon="pi pi-plus" (click)="addFacility()"></button>
        </div>
    </div>

    <!-- 儲存按鈕 -->
    <div class="form-actions">
        <button pButton label="儲存" icon="pi pi-check" class="p-button-success" (click)="saveHotel()"></button>
        <button pButton label="清除" icon="pi pi-refresh" class="p-button-secondary" (click)="resetForm()"></button>
    </div>

</div>
