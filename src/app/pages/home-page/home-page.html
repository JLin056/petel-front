<div class="wrap">
    <div class="banner">
        <div class="banner-carousel">
            <p-carousel
                [value]="bannerImages"
                [numVisible]="1"
                [numScroll]="1"
                [circular]="true"
                [autoplayInterval]="5000"
                [showNavigators]="true"
                [showIndicators]="true"
            >
                <ng-template pTemplate="item" let-image>
                    <div class="banner-image-container">
                        <img [src]="image.src" [alt]="image.alt" class="banner-image">
                    </div>
                </ng-template>
            </p-carousel>
        </div>
        <div class="search-container">
            <div class="search-bar">
                <p-floatlabel variant="in" class="search-label">
                    <p-select [options]="cities" optionLabel="name" optionValue="name" [(ngModel)]="searchParams.city" [showClear]="!!searchParams.city" class="search-item"/>
                    <label class="search-label">縣市</label>
                </p-floatlabel>
                <p-floatlabel variant="in" class="search-label">
                    <p-datepicker inputId="checkIn" class="search-item" dateFormat="yy/mm/dd" showIcon [iconDisplay]="'input'" [(ngModel)]="searchParams.checkIn" [minDate]="minCheckInDate" (onSelect)="onCheckInChange()" />
                    <label class="search-label" for="checkIn">入住日</label>
                </p-floatlabel>
                <p-floatlabel variant="in" class="search-label">
                    <p-datepicker inputId="checkOut" class="search-item" dateFormat="yy/mm/dd" showIcon [iconDisplay]="'input'" [(ngModel)]="searchParams.checkOut" [minDate]="minCheckOutDate" />
                    <label class="search-label" for="checkOut">退房日</label>
                </p-floatlabel>
                <p-floatlabel variant="in" class="search-label">
                    <p-select class="search-item" [options]="types" optionLabel="name" optionValue="id" [(ngModel)]="searchParams.petType" />
                    <label class="search-label">寵物種類</label>
                </p-floatlabel>
                <p-floatlabel variant="in" class="search-label">
                    <p-inputnumber class="search-item" mode="decimal" [showButtons]="true" inputId="minmax-buttons" [min]="1" [max]="10" [(ngModel)]="searchParams.petCount" />
                    <label class="search-label">寵物數量</label>
                </p-floatlabel>
                <p-button label="搜尋" styleClass="petel-search-btn" (onClick)="onSearch()"></p-button>
            </div>
        </div>
    </div>

    <div class="recommend-container">
        <div class="recommend-container-dog" >
            <h3>狗狗旅館 精選店家</h3>
            <div class="hotel-carousel-dog">
                <p-carousel
                    #dogCarousel
                    [value]="dogHotels"
                    [numVisible]="4"
                    [numScroll]="1"
                    [circular]="true"
                    [responsiveOptions]="responsiveOptions"
                >
                    <ng-template pTemplate="item" let-hotel>
                        <div class="item">
                            <img [src]="hotel.image" [alt]="hotel.name" class="hotel-img">
                            <p class="hotel-caption hotel-name-link" (click)="navigateToDetail(hotel.propertyId, hotel.petType)">{{hotel.name}}</p>
                        </div>
                    </ng-template>

                </p-carousel>
            </div>
        </div>

         <div class="recommend-container-cat" >
            <h3>貓貓旅館 精選店家</h3>
            <div class="hotel-carousel-cat">
                <p-carousel
                    #catCarousel
                    [value]="catHotels"
                    [numVisible]="4"
                    [numScroll]="1"
                    [circular]="true"
                    [responsiveOptions]="responsiveOptions"
                >
                    <ng-template pTemplate="item" let-hotel>
                        <div class="item">
                            <img [src]="hotel.image" [alt]="hotel.name" class="hotel-img">
                            <p class="hotel-caption hotel-name-link" (click)="navigateToDetail(hotel.propertyId, hotel.petType)">{{hotel.name}}</p>
                        </div>
                    </ng-template>

                </p-carousel>
            </div>
        </div>
    </div>

    <div class="choose-pet-container">
        <h3>寵物種類</h3>
        <div class="choose-pet-items">
            <div class="choose-pet">
                <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEi9ccQJpgCKejcVKW0qTZC4qaJwyclbwIs49nFqOADMf8ElnYoBGCiZFV_bLwL7EguAhYed8rHMmueeodTu49chM4WYSZYfzsX7habW8xsyQW3V-xExj0GAjsTHODrWLYCQpuzsdzTVKfnI/s800/dog_miniature_pinscher.png" alt="狗狗">
                <button class="choose-pet-btn" (click)="onSearchByPetType('DOG')">狗狗</button>
            </div>
            <div class="choose-pet">
                <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgh9T8iIULZyWTH12dBhJiLlqWJ5jHe9DVdEZ72cJJuA7ru5B5lpJew5VvqmbF_KbYdxABcMxh9YcNr7vUL3CRZpW75EMkPGjowjOaK8R7ivS0eJje_nYNTB2H2eBZTIGf5jsz3MtBHPWo/s800/pet_cat_kedukuroi.png" alt="貓貓">
                <button class="choose-pet-btn" (click)="onSearchByPetType('CAT')">貓貓</button>
            </div>
        </div>
    </div>
</div>
