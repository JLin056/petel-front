<p-toast position="bottom-right"></p-toast>
<div class = "wrap">
<h3 class="title">訂單列表</h3>

<div class="search-container">
    <div class="search-fields">
        <div class="flex flex-col gap-2">
            <label for="orderId">訂單編號</label>
            <input pInputText id="orderId" class="custom-input" [(ngModel)]="orderIdFilter" />
        </div>
        <div class="flex flex-col gap-2">
            <label for="checkIn">入住日期</label>
            <input pInputText id="checkIn" class="custom-input" [(ngModel)]="checkInFilter" placeholder="YYYY-MM-DD" />
        </div>
        <div class="flex flex-col gap-2">
            <label for="userName">訂購人姓名</label>
            <input pInputText id="userName" class="custom-input" [(ngModel)]="userNameFilter" />
        </div>
        <div class="flex flex-col gap-2">
            <label for="propertyName">旅館名稱</label>
            <input pInputText id="propertyName" class="custom-input" [(ngModel)]="propertyNameFilter" />
        </div>
        <div class="search-btn-container">
            <p-button label="搜尋" styleClass="admin-search-btn" (onClick)="onSearch()"></p-button>
        </div>
    </div>
</div>

<div class="card">
  <div class="table-responsive">
    <p-table
      #dt
      [value]="orderList"
      dataKey="ORDER_ID"
      [rows]="pageSize"
      [rowsPerPageOptions]="[1, 5, 10, 15, 20]"
      [paginator]="true"
      [lazy]="true"
      [totalRecords]="totalRecords"
      (onLazyLoad)="onPageChange($event)"
      [tableStyle]="{ 'min-width': '75rem' }"
    >
    <ng-template pTemplate="header">
      <tr>
        <th style="width:11%">訂單編號</th>
        <th style="width:11%">入住日期</th>
        <th style="width:11%">退房日期</th>
        <th style="width:13%">
          <i class="pi pi-user icon-large"></i>
          訂購人姓名
        </th>
        <th style="width:13%">
          <i class="pi pi-building icon-large"></i>
          旅館名稱
        </th>
        <th style="width:9%">總價格</th>
        <th style="width:11%">付款方式</th>
        <th style="width:9%">狀態</th>
        <th style="width:12%">操作</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-order>
      <tr>
        <td><span class="text-large">{{ order.ORDER_ID }}</span></td>
        <td><span class="text-large">{{ order.CHECK_IN }}</span></td>
        <td><span class="text-large">{{ order.CHECK_OUT }}</span></td>
        <td><span class="text-large">{{ order.FINAL_USER_NAME }}</span></td>
        <td><span class="text-large">{{ order.PROPERTY_NAME }}</span></td>
        <td><span class="text-large">{{ order.HOTEL_CHARGES | price }}</span></td>
        <td><span class="text-large">{{ order.PAYMENT_METHOD || '-' }}</span></td>
        <td>
          <p-tag [value]="order.STATUS" [severity]="getSeverity(order.STATUS) || undefined" class="tag-large" />
        </td>
        <td>
          <p-button styleClass="detailBtn" label="詳細"  severity="info" (onClick)="showOrderDetail(order)" />
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="9">查無訂單資料</td>
      </tr>
    </ng-template>
  </p-table>
  </div>
</div>
</div>
<!-- 訂單詳細資料彈窗 -->
<app-order-detail-dialog
  [(visible)]="showDetailDialog"
  [order]="selectedOrder"
  (noteUpdated)="onNoteUpdated($event)">
</app-order-detail-dialog>
