<div class="hotel-container">
    <h2 class="page-title">修改旅館資訊</h2>

    <form [formGroup]="propertyForm" (ngSubmit)="onSubmit()">

        <!-- 旅館圖片區 (保留給之後的圖片 API) -->
        <div class="info-section">
            <h3>旅館圖片</h3>
            <div class="image-placeholder">
                <i class="pi pi-images" style="font-size: 3rem; color: #ccc;"></i>
                <p style="color: #999; margin-top: 1rem;">圖片功能開發中，敬請期待</p>
            </div>
        </div>

        <!-- 基本資訊 -->
        <div class="info-section">
            <h3>基本資訊</h3>
            <div class="form-grid">
                <label>旅館名稱 <span class="required">*</span></label>
                <input type="text" pInputText formControlName="name" [disabled]="true" />

                <label>特許寵物業許可證號</label>
                <input type="text" pInputText formControlName="businessCode" [disabled]="true" />

                <label>銀行帳號 <span class="required">*</span></label>
                <input type="text" pInputText formControlName="bankAccount">

                <label>電話 <span class="required">*</span></label>
                <input type="text" pInputText formControlName="tel">

                <label>地址 <span class="required">*</span></label>
                <input class="city-input" type="text" pInputText formControlName="city" placeholder="縣市名">
                <input class="district-input" type="text" pInputText formControlName="district" placeholder="鄉鎮市區名">
                <input class="addressDetail-input" type="text" pInputText formControlName="address" placeholder="詳細地址">

                <label>設施 <span class="required">*</span></label>
                <!-- <input type="checkbox" name="facilityId1" [checked]="propertyData.facilities[0].facilityId" [value]="propertyData.facilities[0].facilityId"/> 寵物友善
                <input type="checkbox" name="facilityId2" [checked]="propertyData.facilities[1].facilityId" [value]="propertyData.facilities[1].facilityId"/> 鄰近公園
                <input type="checkbox" name="facilityId3" [checked]="propertyData.facilities[2].facilityId" [value]="propertyData.facilities[2].facilityId"/> 鄰近寵物餐廳
                <input type="checkbox" name="facilityId4" [checked]="propertyData.facilities[3].facilityId" [value]="propertyData.facilities[3].facilityId"/> 獨立房間
                <input type="checkbox" name="facilityId5" [checked]="propertyData.facilities[4].facilityId" [value]="propertyData.facilities[4].facilityId"/> 全天候攝影監控 -->
            </div>
        </div>

        <!-- 旅館說明 -->
        <div class="info-section">
            <h3>旅館介紹</h3>
            <textarea pInputTextarea rows="3" formControlName="info"></textarea>

            <h3>入住須知</h3>
            <textarea pInputTextarea rows="3" formControlName="checkNotice"></textarea>

            <h3>寵物須知</h3>
            <textarea pInputTextarea rows="3" formControlName="petNotice"></textarea>

            <h3>旅館規範</h3>
            <textarea pInputTextarea rows="3" formControlName="propertyNotice"></textarea>
        </div>

        <!-- 按鈕 -->
        <div class="form-actions">
            <button pButton label="儲存" icon="pi pi-check" class="btn-save" type="submit"></button>
            <button pButton label="取消" icon="pi pi-times" class="btn-clear" type="button"
                (click)="onCancelClick()"></button>
        </div>

    </form>

    <app-shared-confirm-dialog [(visible)]="cancelConfirmVisible" header="取消確認" message="確定要取消修改嗎？已修改的資料將不會被儲存。"
        confirmLabel="確定" cancelLabel="繼續編輯" (confirm)="onCancelConfirm()" (cancel)="onCancelCancel()">
    </app-shared-confirm-dialog>
</div>
